name: Wire Google Calendar sync UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-calendar-oauth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load enhanced calendar integration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="calendar-sync.js?v=20260915-1437"></script>'

          # Remove an older injected version if this workflow is rerun.
          import re
          s = re.sub(r'\n?<script src="calendar-sync\.js(?:\?v=[^"]*)?"></script>', '', s)

          if '</body>' not in s:
              raise SystemExit('Could not find </body> in index.html')

          s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s)
          PY

      - name: Commit calendar integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Google Calendar frontend integration"
          git push
