name: Deploy NOVA journal UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-calendar-oauth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load NOVA journal and calendar integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          style = '<link rel="stylesheet" href="nova-journal.css?v=20260915-2305">'
          tags = (
              '<script src="calendar-sync.js?v=20260915-2305"></script>\n'
              '<script src="calendar-universal.js?v=20260915-2305"></script>\n'
              '<script src="nova-journal.js?v=20260915-2305"></script>'
          )

          s = re.sub(r'\n?<link rel="stylesheet" href="nova-journal\.css(?:\?v=[^"]*)?">', '', s)
          s = re.sub(r'\n?<script src="calendar-sync\.js(?:\?v=[^"]*)?"></script>', '', s)
          s = re.sub(r'\n?<script src="calendar-universal\.js(?:\?v=[^"]*)?"></script>', '', s)
          s = re.sub(r'\n?<script src="calendar-outlook\.js(?:\?v=[^"]*)?"></script>', '', s)
          s = re.sub(r'\n?<script src="nova-journal\.js(?:\?v=[^"]*)?"></script>', '', s)

          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('Could not find document closing tags in index.html')

          s = s.replace('</head>', style + '\n</head>', 1)
          s = s.replace(
              'Google Calendar data is used only for user-requested planning and synchronization features.',
              'Calendar data is used only for user-requested planning features.'
          )
          s = s.replace('</body>', tags + '\n</body>', 1)
          p.write_text(s)
          PY

      - name: Commit NOVA journal integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load refined NOVA journal experience"
          git push
