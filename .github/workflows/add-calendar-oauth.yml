name: Deploy NOVA built-in calendar UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-calendar-oauth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load built-in calendar integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          tags = (
              '<script src="calendar-sync.js?v=20260915-2245"></script>\n'
              '<script src="calendar-universal.js?v=20260915-2245"></script>\n'
              '<script src="calendar-outlook.js?v=20260915-2245"></script>'
          )

          s = re.sub(r'\n?<script src="calendar-sync\.js(?:\?v=[^"]*)?"></script>', '', s)
          s = re.sub(r'\n?<script src="calendar-universal\.js(?:\?v=[^"]*)?"></script>', '', s)
          s = re.sub(r'\n?<script src="calendar-outlook\.js(?:\?v=[^"]*)?"></script>', '', s)

          if '</body>' not in s:
              raise SystemExit('Could not find </body> in index.html')

          s = s.replace(
              'Google Calendar data is used only for user-requested planning and synchronization features.',
              'Calendar data is used only for user-requested planning features.'
          )
          s = s.replace('</body>', tags + '\n</body>', 1)
          p.write_text(s)
          PY

      - name: Commit built-in calendar integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load simplified Outlook Calendar shortcut in NOVA"
          git push
