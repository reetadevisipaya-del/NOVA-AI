name: NOVA final sanity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required NOVA files
        run: |
          test -s index.html
          test -s calendar-sync.js
          test -s calendar-universal.js
          test -s nova-journal.js
          test -s nova-journal.css
          grep -q "NOVA Assistant" index.html
          grep -q "ensureBackend" index.html
          echo "NOVA final files verified."
