<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — AI Focus Planner</title>
<style>
html,body{margin:0;min-height:100%;background:#f3f0e8;font-family:Arial,sans-serif;color:#1f2b2a}.nova-boot{min-height:100vh;display:grid;place-items:center;font-weight:700;letter-spacing:.02em}
</style>
</head>
<body><div class="nova-boot">Loading NOVA…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./legacy.html?build=20260917-2',{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load NOVA');
    let html=await response.text();
    html=html
      .replace('nova-journal.css?v=20260915-2305','nova-journal.css?v=20260917-2')
      .replace('calendar-sync.js?v=20260915-2305','calendar-sync.js?v=20260917-2')
      .replace('calendar-universal.js?v=20260915-2305','calendar-universal.js?v=20260917-2')
      .replace('nova-journal.js?v=20260915-2305','nova-journal.js?v=20260917-2')
      .replace('</head>','<style>#calendarBtn,#addEventBtn,#addTaskBtn,#novaScheduleBtn,#novaScheduleTodayBtn{display:none!important}</style></head>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="nova-boot">NOVA could not load. Please refresh.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
